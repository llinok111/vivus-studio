name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm run test:unit

  upstream:
    name: upstream karma (89 specs, unmodified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npx karma start test/karma.conf.js --single-run --browsers ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome

  build:
    name: build bundle + runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npm run build
      - name: Fail if the checked-in bundle is stale
        run: git diff --exit-code -- studio/app.bundle.js dist/svg-motion.mjs
